[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quoded"
version = "0.1.0"
description = "Proof verification pipeline with multi-assistant backends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "pdfplumber>=0.11.0",
]

[project.scripts]
quoded = "quoded.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
cache-dir = ".uv-cache"
